name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2026.5.15-t1530)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      promote_to_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          # Ensure gradle wrapper is executable
          chmod +x ./android/gradlew

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..
          mkdir -p build/android
          cp android/app/build/outputs/apk/debug/app-debug.apk build/android/oceanpay-${{ inputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceanpay-android-apk
          path: build/android/*.apk

      - name: Create GitHub Release
        if: ${{ inputs.promote_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-android
          name: oceanpay ${{ inputs.version }} (Android)
          body: ${{ inputs.release_notes }}
          prerelease: false
          make_latest: false
          files: build/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
